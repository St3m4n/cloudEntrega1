{
  "services": {
    "bff": {
      "image": "${IMAGE_REPOSITORY:?set repository}/bff:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        ".env"
      ],
      "ports": [
        "8080:8080"
      ],
      "volumes": [
        "bff-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "bff-data": {}
  }
}
