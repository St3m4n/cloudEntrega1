{
  "services": {
    "kafka-admin": {
      "image": "${IMAGE_REPOSITORY:?set repository}/kafka-admin:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        ".env"
      ],
      "ports": [
        "8088:8088"
      ],
      "volumes": [
        "kafka-admin-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "kafka-admin-data": {}
  }
}
