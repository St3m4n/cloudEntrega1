{
  "services": {
    "catalog": {
      "image": "${IMAGE_REPOSITORY:?set repository}/catalog:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        ".env"
      ],
      "ports": [
        "8082:8082"
      ],
      "volumes": [
        "catalog-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "catalog-data": {}
  }
}
