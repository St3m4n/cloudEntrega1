{
  "services": {
    "rabbit-admin": {
      "image": "${IMAGE_REPOSITORY:?set repository}/rabbit-admin:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        ".env"
      ],
      "ports": [
        "8087:8087"
      ],
      "volumes": [
        "rabbit-admin-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "rabbit-admin-data": {}
  }
}
