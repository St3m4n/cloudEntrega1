          "max-file": "3"
        }
      }
    },
    "mailpit": {
      "image": "axllent/mailpit:v1.24",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:8025:8025"
      ],
      "mem_limit": "128m"
    }
  },
  "volumes": {
    "bff-data": {},
    "catalog-data": {},
    "orders-data": {},
    "audit-data": {},
    "report-data": {},
    "notify-data": {},
    "rabbit-admin-data": {},
    "kafka-admin-data": {}
  }
}
