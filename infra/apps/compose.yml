{
  "services": {
    "bff": {
      "image": "${IMAGE_REPOSITORY:?set repository}/bff:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
      },
      "mem_limit": "768m",
      "volumes": [
        "bff-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "ports": [
        "8080:8080"
      ]
    },
    "catalog": {
      "image": "${IMAGE_REPOSITORY:?set repository}/catalog:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError",
        "DB_USER": "P360_CATALOG",
        "DB_PASSWORD": "${CATALOG_DB_PASSWORD:?set schema password}"
      },
      "mem_limit": "768m",
      "volumes": [
        "catalog-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "orders": {
      "image": "${IMAGE_REPOSITORY:?set repository}/orders:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError",
        "DB_USER": "P360_ORDERS",
        "DB_PASSWORD": "${ORDERS_DB_PASSWORD:?set schema password}"
      },
      "mem_limit": "768m",
      "volumes": [
        "orders-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "audit": {
      "image": "${IMAGE_REPOSITORY:?set repository}/audit:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError",
        "DB_USER": "P360_AUDIT",
        "DB_PASSWORD": "${AUDIT_DB_PASSWORD:?set schema password}"
      },
      "mem_limit": "768m",
      "volumes": [
        "audit-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "report": {
      "image": "${IMAGE_REPOSITORY:?set repository}/report:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError",
        "DB_USER": "P360_REPORT",
        "DB_PASSWORD": "${REPORT_DB_PASSWORD:?set schema password}"
      },
      "mem_limit": "768m",
      "volumes": [
        "report-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "notify": {
      "image": "${IMAGE_REPOSITORY:?set repository}/notify:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
      },
      "mem_limit": "768m",
      "volumes": [
