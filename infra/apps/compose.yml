          "max-file": "3"
        }
      }
    },
    "rabbit-admin": {
      "image": "${IMAGE_REPOSITORY:?set repository}/rabbit-admin:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
      },
      "mem_limit": "768m",
      "volumes": [
        "rabbit-admin-data:/app/data"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "kafka-admin": {
      "image": "${IMAGE_REPOSITORY:?set repository}/kafka-admin:${IMAGE_TAG:-1.0.0}",
      "restart": "unless-stopped",
      "env_file": [
        "common.env"
      ],
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
      },
      "mem_limit": "768m",
      "volumes": [
        "kafka-admin-data:/app/data"
