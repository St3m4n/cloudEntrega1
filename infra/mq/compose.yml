{
  "services": {
    "rabbit1": {
      "image": "rabbitmq:4.1-management",
      "hostname": "rabbit1",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_NODENAME": "rabbit@rabbit1",
        "RABBITMQ_ERLANG_COOKIE": "${RABBIT_COOKIE:?set RABBIT_COOKIE}",
        "RABBITMQ_DEFAULT_USER": "${RABBIT_USER:-pedidos360}",
        "RABBITMQ_DEFAULT_PASS": "${RABBIT_PASSWORD:?set RABBIT_PASSWORD}"
      },
      "volumes": [
        "rabbit1:/var/lib/rabbitmq",
        "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmqctl",
          "eval",
          "case length(rabbit_nodes:list_running()) of N when N >= 2 -> ok; _ -> erlang:error(cluster_not_ready) end."
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 12
      },
      "ports": [
        "5672:5672",
        "${MANAGEMENT_BIND:-127.0.0.1}:15672:15672"
      ]
    },
    "rabbit2": {
      "image": "rabbitmq:4.1-management",
      "hostname": "rabbit2",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_NODENAME": "rabbit@rabbit2",
        "RABBITMQ_ERLANG_COOKIE": "${RABBIT_COOKIE:?set RABBIT_COOKIE}",
        "RABBITMQ_DEFAULT_USER": "${RABBIT_USER:-pedidos360}",
        "RABBITMQ_DEFAULT_PASS": "${RABBIT_PASSWORD:?set RABBIT_PASSWORD}"
      },
      "volumes": [
        "rabbit2:/var/lib/rabbitmq",
        "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmqctl",
          "eval",
          "case length(rabbit_nodes:list_running()) of N when N >= 2 -> ok; _ -> erlang:error(cluster_not_ready) end."
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 12
      },
      "ports": [
        "5673:5672",
        "${MANAGEMENT_BIND:-127.0.0.1}:15673:15672"
      ]
    }
  },
  "volumes": {
    "rabbit1": {},
    "rabbit2": {}
  }
}
