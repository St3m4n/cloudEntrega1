{
  "services": {
    "zk1": {
      "image": "confluentinc/cp-zookeeper:7.7.1",
      "hostname": "zk1",
      "restart": "unless-stopped",
      "environment": {
        "ZOOKEEPER_SERVER_ID": "1",
        "ZOOKEEPER_CLIENT_PORT": "2181",
        "ZOOKEEPER_TICK_TIME": "2000",
        "ZOOKEEPER_INIT_LIMIT": "10",
        "ZOOKEEPER_SYNC_LIMIT": "5",
        "ZOOKEEPER_SERVERS": "zk1:2888:3888;zk2:2888:3888;zk3:2888:3888"
      },
      "volumes": [
        "zk1-data:/var/lib/zookeeper/data",
        "zk1-log:/var/lib/zookeeper/log"
      ]
    },
    "kafka1": {
      "image": "confluentinc/cp-kafka:7.7.1",
      "hostname": "kafka1",
      "restart": "unless-stopped",
      "depends_on": [
        "zk1",
        "zk2",
        "zk3"
      ],
      "ports": [
        "9092:9092"
      ],
      "environment": {
        "KAFKA_BROKER_ID": "1",
        "KAFKA_ZOOKEEPER_CONNECT": "zk1:2181,zk2:2181,zk3:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "2",
        "KAFKA_DEFAULT_REPLICATION_FACTOR": "3",
        "KAFKA_MIN_INSYNC_REPLICAS": "2",
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka1:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 20
      }
    },
    "zk2": {
      "image": "confluentinc/cp-zookeeper:7.7.1",
      "hostname": "zk2",
      "restart": "unless-stopped",
      "environment": {
        "ZOOKEEPER_SERVER_ID": "2",
        "ZOOKEEPER_CLIENT_PORT": "2181",
        "ZOOKEEPER_TICK_TIME": "2000",
        "ZOOKEEPER_INIT_LIMIT": "10",
        "ZOOKEEPER_SYNC_LIMIT": "5",
        "ZOOKEEPER_SERVERS": "zk1:2888:3888;zk2:2888:3888;zk3:2888:3888"
      },
      "volumes": [
        "zk2-data:/var/lib/zookeeper/data",
        "zk2-log:/var/lib/zookeeper/log"
      ]
    },
    "kafka2": {
      "image": "confluentinc/cp-kafka:7.7.1",
      "hostname": "kafka2",
      "restart": "unless-stopped",
      "depends_on": [
        "zk1",
        "zk2",
        "zk3"
      ],
      "ports": [
        "9093:9093"
      ],
      "environment": {
        "KAFKA_BROKER_ID": "2",
        "KAFKA_ZOOKEEPER_CONNECT": "zk1:2181,zk2:2181,zk3:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "2",
        "KAFKA_DEFAULT_REPLICATION_FACTOR": "3",
        "KAFKA_MIN_INSYNC_REPLICAS": "2",
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka2:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 20
      }
    },
    "zk3": {
      "image": "confluentinc/cp-zookeeper:7.7.1",
      "hostname": "zk3",
      "restart": "unless-stopped",
      "environment": {
        "ZOOKEEPER_SERVER_ID": "3",
        "ZOOKEEPER_CLIENT_PORT": "2181",
        "ZOOKEEPER_TICK_TIME": "2000",
        "ZOOKEEPER_INIT_LIMIT": "10",
        "ZOOKEEPER_SYNC_LIMIT": "5",
        "ZOOKEEPER_SERVERS": "zk1:2888:3888;zk2:2888:3888;zk3:2888:3888"
      },
      "volumes": [
        "zk3-data:/var/lib/zookeeper/data",
        "zk3-log:/var/lib/zookeeper/log"
      ]
    },
    "kafka3": {
      "image": "confluentinc/cp-kafka:7.7.1",
      "hostname": "kafka3",
      "restart": "unless-stopped",
      "depends_on": [
        "zk1",
        "zk2",
        "zk3"
      ],
      "ports": [
        "9094:9094"
      ],
      "environment": {
        "KAFKA_BROKER_ID": "3",
        "KAFKA_ZOOKEEPER_CONNECT": "zk1:2181,zk2:2181,zk3:2181",
        "KAFKA_LISTENERS": "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9094",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "3",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "2",
        "KAFKA_DEFAULT_REPLICATION_FACTOR": "3",
        "KAFKA_MIN_INSYNC_REPLICAS": "2",
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m"
      },
      "volumes": [
        "kafka3:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 20
      }
    },
    "init-topics": {
      "image": "confluentinc/cp-kafka:7.7.1",
      "depends_on": {
        "kafka1": {
          "condition": "service_healthy"
        },
        "kafka2": {
          "condition": "service_healthy"
        },
        "kafka3": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": [
        "/bin/bash",
        "-c"
      ],
      "command": [
        "set -e\nkafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 3 --config cleanup.policy=delete --config retention.ms=604800000 --config min.insync.replicas=2\nkafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic audit.timeline --partitions 3 --replication-factor 3 --config cleanup.policy=compact,delete --config retention.ms=2592000000 --config min.insync.replicas=2\nkafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic orders.events.ms-pedidos360-report.DLT --partitions 3 --replication-factor 3 --config cleanup.policy=delete --config retention.ms=1209600000 --config min.insync.replicas=2\nkafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic audit.timeline.ms-pedidos360-audit.DLT --partitions 3 --replication-factor 3 --config cleanup.policy=delete --config retention.ms=1209600000 --config min.insync.replicas=2"
      ],
      "restart": "no"
    },
    "kafka-ui": {
      "image": "provectuslabs/kafka-ui:v0.7.2",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:8090:8080"
      ],
      "environment": {
        "KAFKA_CLUSTERS_0_NAME": "pedidos360",
        "KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS": "kafka1:29092,kafka2:29092,kafka3:29092",
        "KAFKA_CLUSTERS_0_ZOOKEEPER": "zk1:2181,zk2:2181,zk3:2181"
      },
      "depends_on": [
        "kafka1",
        "kafka2",
        "kafka3"
      ]
    }
  },
  "volumes": {
    "zk1-data": {},
    "zk1-log": {},
    "kafka1": {},
    "zk2-data": {},
    "zk2-log": {},
    "kafka2": {},
    "zk3-data": {},
    "zk3-log": {},
    "kafka3": {}
  }
}
