server.port=${PORT:8086}
spring.application.name=ms-pedidos360-notify
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USER:pedidos360}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
app.catalog-url=${CATALOG_URL:http://localhost:8082}
app.orders-url=${ORDERS_URL:http://localhost:8083}
app.audit-url=${AUDIT_URL:http://localhost:8084}
app.report-url=${REPORT_URL:http://localhost:8085}
app.rabbit-admin-url=${RABBIT_ADMIN_URL:http://localhost:8087}
app.kafka-admin-url=${KAFKA_ADMIN_URL:http://localhost:8088}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail-from=${MAIL_FROM:pedidos360@example.com}
app.notify-dir=${NOTIFY_DIR:./data/notify}
